        -Dlogback.configurationFile=/config/log/logback.xml
        -Dlogging.config=/config/log/logback.xml
    volumes:
      - service-config:/config:ro
    depends_on:
      service-configuration:
        condition: service_completed_successfully
      consul:
        condition: service_healthy
    logging: *logging

volumes:
  service-config:
  nginx-log:
  auth-tomcat-log:
  consul-template-log:
  notification-truststore:
