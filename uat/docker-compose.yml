x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "7"

services:

  service-configuration:
    build:
      context: ./config
    volumes:
      - service-config:/config
    logging: *logging

  consul:
    image: hashicorp/consul:${OL_CONSUL_VERSION}
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    environment:
      CONSUL_BIND_INTERFACE: eth0
    ports:
      - "8300:8300"
      - "8500:8500"
      - "8600:8600/tcp"
      - "8600:8600/udp"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/v1/status/leader"]
      interval: 30s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:3.2.12
    depends_on:
      consul:
        condition: service_healthy
    logging: *logging

  nginx:
    image: openlmis/nginx:${OL_NGINX_VERSION}
    ports:
      - "80:80"
    env_file: settings.env
    environment:
      NGINX_LOG_DIR: '/var/log/nginx/log'
    volumes:
      - nginx-log:/var/log/nginx/log
      - consul-template-log:/var/log/consul-template
    depends_on:
      consul:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 20000
        hard: 40000
    logging: *logging

  reference-ui:
    restart: always
    image: openlmisgambia/ui:${GAMBIA_UI_VERSION}
    env_file: settings.env
    depends_on:
      consul:
        condition: service_healthy
      # Services from which data is being taken during logging in
      referencedata:
        condition: service_healthy
      auth:
        condition: service_healthy
      notification:
        condition: service_healthy
      report:
        condition: service_healthy
      fulfillment:
        condition: service_healthy
      stockmanagement:
        condition: service_healthy
    logging: *logging

  openlmis-ui:
    restart: always
    image: openlmis/openlmis-ui:${OL_UI_VERSION}
    env_file: settings.env
    environment:
      BASE_PATH: /v2
    depends_on:
      consul:
        condition: service_healthy
    logging: *logging

  ftp:
    image: driesva/proftpd
    ports:
      - "${OL_FTP_PORT_21:-21}:21"
      - "${OL_FTP_PORT_20:-20}:20"
    env_file: settings.env
    depends_on:
      consul:
        condition: service_healthy
    logging: *logging

  requisition:
    restart: always
    image: openlmis/requisition:${OL_REQUISITION_VERSION}
    labels:
      monitoring.scrape: "true"
      monitoring.port: "8080"
      monitoring.path: "/actuator/prometheus"
      monitoring.service: "requisition"
    env_file: settings.env
    environment:
      # Overrides what is in settings.env, needed because of restart_or_restore.sh
      spring_profiles_active: ${spring_profiles_active}
      # logback.configurationFile applies the config from JVM start; the jar's own
      # logback.xml logs to syslog host "log", and its startup error makes Spring abort.
      JAVA_OPTS: >-
        -Xms1280m
        -Xmx1280m
        -Djava.security.egd=file:/dev/./urandom
        -Dlogback.configurationFile=/config/log/logback.xml
        -Dlogging.config=/config/log/logback.xml
    volumes:
      - service-config:/config:ro
    depends_on:
      service-configuration:
        condition: service_completed_successfully
      consul:
        condition: service_healthy
    healthcheck:
      test: "wget --spider http://localhost:8080/actuator/health || exit 1"
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 5
    logging: *logging

  referencedata:
    restart: always
    image: openlmis/referencedata:${OL_REFERENCEDATA_VERSION}
    labels:
      monitoring.scrape: "true"
      monitoring.port: "8080"
      monitoring.path: "/actuator/prometheus"
      monitoring.service: "referencedata"
    env_file: settings.env
    environment:
      spring_profiles_active: ${spring_profiles_active}
      JAVA_OPTS: >-
        -Xms1280m
        -Xmx1280m
        -Djava.security.egd=file:/dev/./urandom
        -Dlogback.configurationFile=/config/log/logback.xml
        -Dlogging.config=/config/log/logback.xml
    volumes:
      - service-config:/config:ro
    depends_on:
      service-configuration:
        condition: service_completed_successfully
      consul:
        condition: service_healthy
    healthcheck:
      test: "wget --spider http://localhost:8080/actuator/health || exit 1"
      interval: 30s
      timeout: 5s
      start_period: 240s
      retries: 5
    logging: *logging

  auth:
    restart: always
    image: openlmis/auth:${OL_AUTH_VERSION}
    labels:
      monitoring.scrape: "true"
      monitoring.port: "8080"
      monitoring.path: "/actuator/prometheus"
      monitoring.service: "auth"
    env_file: settings.env
    environment:
      spring_profiles_active: ${spring_profiles_active}
      JAVA_OPTS: >-
        -Xms386m
        -Xmx386m
        -Djava.security.egd=file:/dev/./urandom
        -Dlogback.configurationFile=/config/log/logback.xml
        -Dlogging.config=/config/log/logback.xml
    volumes:
      - service-config:/config:ro
      - auth-tomcat-log:/var/log/auth-tomcat
    depends_on:
      service-configuration:
        condition: service_completed_successfully
      consul:
        condition: service_healthy
    healthcheck:
      test: "wget --spider http://localhost:8080/actuator/health || exit 1"
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 5
    logging: *logging

  notification-truststore:
    build:
      context: config/notification
    volumes:
      - notification-truststore:/truststore
    entrypoint:
      - sh
      - -c
      - |
        set -e
        SRC=$$(find "$$JAVA_HOME" -name cacerts | head -n1)
        cp "$$SRC" /truststore/cacerts
        chmod u+w /truststore/cacerts
        keytool -importcert -noprompt -alias mail-gov-gm -file /tmp/mail-gov-gm.pem \
          -keystore /truststore/cacerts -storepass changeit
    logging: *logging

  notification:
    restart: always
    image: openlmis/notification:${OL_NOTIFICATION_VERSION}
    labels:
      monitoring.scrape: "true"
      monitoring.port: "8080"
      monitoring.path: "/actuator/prometheus"
      monitoring.service: "notification"
    env_file: settings.env
    environment:
      spring_profiles_active: ${spring_profiles_active}
      JAVA_OPTS: >-
        -Xms512m
        -Xmx512m
        -Djava.security.egd=file:/dev/./urandom
        -Dlogback.configurationFile=/config/log/logback.xml
        -Dlogging.config=/config/log/logback.xml
        -Djavax.net.ssl.trustStore=/truststore/cacerts
    volumes:
      - service-config:/config:ro
      - notification-truststore:/truststore:ro
    depends_on:
      service-configuration:
        condition: service_completed_successfully
      notification-truststore:
        condition: service_completed_successfully
      consul:
        condition: service_healthy
    healthcheck:
      test: "wget --spider http://localhost:8080/actuator/health || exit 1"
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 5
    logging: *logging

  fulfillment:
    restart: always
    image: openlmis/fulfillment:${OL_FULFILLMENT_VERSION}
    labels:
      monitoring.scrape: "true"
      monitoring.port: "8080"
      monitoring.path: "/actuator/prometheus"
      monitoring.service: "fulfillment"
    env_file: settings.env
    environment:
      spring_profiles_active: ${spring_profiles_active}
      JAVA_OPTS: >-
        -Xms512m
        -Xmx512m
        -Djava.security.egd=file:/dev/./urandom
        -Dlogback.configurationFile=/config/log/logback.xml
        -Dlogging.config=/config/log/logback.xml
    volumes:
      - service-config:/config:ro
    depends_on:
      service-configuration:
        condition: service_completed_successfully
      consul:
        condition: service_healthy
    healthcheck:
      test: "wget --spider http://localhost:8080/actuator/health || exit 1"
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 5
    logging: *logging

  stockmanagement:
    restart: always
    image: openlmis/stockmanagement:${OL_STOCKMANAGEMENT_VERSION}
    labels:
      monitoring.scrape: "true"
      monitoring.port: "8080"
      monitoring.path: "/actuator/prometheus"
      monitoring.service: "stockmanagement"
    env_file: settings.env
    environment:
      spring_profiles_active: ${spring_profiles_active}
      JAVA_OPTS: >-
        -Xms1024m
        -Xmx1024m
        -Djava.security.egd=file:/dev/./urandom
        -Dlogback.configurationFile=/config/log/logback.xml
        -Dlogging.config=/config/log/logback.xml
    volumes:
      - service-config:/config:ro
    depends_on:
      service-configuration:
        condition: service_completed_successfully
      consul:
        condition: service_healthy
    healthcheck:
      test: "wget --spider http://localhost:8080/actuator/health || exit 1"
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 5
    logging: *logging

  report:
