# Gambia overrides for the report translations, merged on top of the bundle shipped in
# gambia-reports. Only values that differ from the shipped English source are applied.
# report.pattern.labelledValue must be present in a deployment override (OpenLMIS 3.20).

### GLOBAL HEADERS
report.globalHeader.subtitle=Ministry of Health, The Gambia
report.globalHeader.title=The Gambia OpenLMIS

### PATTERNS
report.pattern.labelledValue={0}: {1}

### REQUISITION PRINT COLUMN HEADERS
# OpenLMIS 3.20 prints requisitions with these shared labels instead of the labels configured on
# the requisition template. The Gambia Essential Medicines template names these columns differently.
# One label per column for every program (OPSD-123).
report.column.beginningBalance=Opening balance
report.column.calculatedOrderQuantity=Quantity to Order
report.column.remarks=Comments
report.column.totalReceivedQuantity=Quantity Received
report.column.totalStockoutDays=Days Out of Stock
